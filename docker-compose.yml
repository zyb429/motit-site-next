services:
  mysql:
    image: mysql:8.0
    container_name: motit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: motit
      MYSQL_USER: motit
      MYSQL_PASSWORD: motit
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # если хочешь сразу залить дамп Strapi:
      # - ./dump_before_migration.sql:/docker-entrypoint-initdb.d/dump.sql
    command: --default-authentication-plugin=mysql_native_password

  minio:
    image: quay.io/minio/minio:latest
    container_name: motit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # создаёт бакет при старте
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb --ignore-existing local/motit-uploads;
      mc anonymous set download local/motit-uploads;
      echo 'MinIO ready';
      "

volumes:
  mysql_data:
  minio_data:
